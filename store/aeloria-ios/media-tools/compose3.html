<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="file:///home/user/kinzhal-site/play/aeloria/fonts/fonts.css">
<style>
html,body{margin:0;width:100vw;height:100vh;overflow:hidden;background:#07040f}
.bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(14px) brightness(.45) saturate(1.2)}
.glow{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 16%,#ffb84055,transparent 55%),linear-gradient(#05030d00 40%,#05030dcc)}
.cap{position:absolute;left:0;right:0;top:3.6vh;text-align:center;padding:0 6vw}
.cap b{display:block;font-family:Cinzel,serif;font-weight:900;line-height:1.08;color:#fff1c4;letter-spacing:.02em;text-shadow:0 .25em 0 #000,0 0 .6em #ffb84088}
.cap span{display:block;margin-top:.9vh;font-family:Cairo,sans-serif;font-weight:700;line-height:1.3;color:#e9dcff;text-shadow:0 .1em .4em #000}
html[lang=ar] .cap b{font-family:Cairo,sans-serif;font-weight:800;letter-spacing:0}
html[lang=zh] .cap b{font-family:"WenQuanYi Zen Hei","PingFang SC",sans-serif;letter-spacing:.06em}
html[lang=zh] .cap span{font-family:"WenQuanYi Zen Hei","PingFang SC",sans-serif}
html[lang=ru] .cap b{font-family:Georgia,"DejaVu Serif",serif}
.frame{position:absolute;left:50%;bottom:-2.5vh;transform:translateX(-50%);width:82vw;height:82vh;border-radius:min(7vw,5vh);overflow:hidden;box-shadow:0 0 0 .9vmin #e8a33d,0 0 0 1.6vmin #5a3410,0 3vh 6vh #000c}
.frame img{width:100%;height:auto;display:block}
</style></head><body><div class="bg" id="bg"></div><div class="glow"></div>
<div class="cap" id="cap"><b id="t"></b><span id="s"></span></div><div class="frame"><img id="shot"></div>
<script>
const q = new URLSearchParams(location.search), lang = q.get('lang') || 'en';
document.documentElement.lang = lang; if (lang === 'ar') document.getElementById('cap').dir = 'rtl';
document.getElementById('bg').style.backgroundImage = `url(${q.get('bg')})`;
document.getElementById('t').textContent = q.get('t'); document.getElementById('s').textContent = q.get('s');
document.getElementById('shot').src = q.get('img');
// Fit the caption into the space above the framed screenshot (top 3.6vh … 16.5vh).
window.fit = () => { const t = document.getElementById('t'), s = document.getElementById('s'), cap = document.getElementById('cap');
  let size = Math.min(innerWidth * .066, innerHeight * .045); const room = innerHeight * .165 - innerHeight * .036;
  for (let i = 0; i < 40; i++) { t.style.fontSize = size + 'px'; s.style.fontSize = size * .58 + 'px'; if (cap.offsetHeight <= room) break; size *= .94; }
  return size; };
</script></body></html>
