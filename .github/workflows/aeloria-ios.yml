# Compiles the Aeloria iOS app (unsigned, simulator) and smoke-tests that the bundled game loads.
name: Aeloria iOS build

on:
  push:
    paths:
      - 'ios/aeloria/**'
      - 'play/aeloria/**'
      - '.github/workflows/aeloria-ios.yml'
  workflow_dispatch:

concurrency:
  group: aeloria-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast checks on Linux: config files parse, game scripts are valid, bundled assets exist.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate plists, project spec and game files
        run: |
          python3 - <<'PY'
          import plistlib, json, os, sys, yaml
          base = 'ios/aeloria'
          for p in ['Aeloria/Info.plist', 'Aeloria/PrivacyInfo.xcprivacy']:
              d = plistlib.load(open(os.path.join(base, p), 'rb')); print('ok', p, len(d), 'keys')
          info = plistlib.load(open(base + '/Aeloria/Info.plist', 'rb'))
          assert info['GADApplicationIdentifier'] == 'ca-app-pub-5681105275743934~9324813833'
          assert info['ITSAppUsesNonExemptEncryption'] is False and info['NSUserTrackingUsageDescription']
          spec = yaml.safe_load(open(base + '/project.yml')); assert 'Aeloria' in spec['targets']; print('ok project.yml')
          for root, _, files in os.walk(base + '/Aeloria/Assets.xcassets'):
              for f in files:
                  if f == 'Contents.json':
                      c = json.load(open(os.path.join(root, f)))
                      for img in c.get('images', []):
                          if 'filename' in img: assert os.path.exists(os.path.join(root, img['filename'])), img
          print('ok assets')
          man = json.load(open('play/aeloria/art/manifest.json')); missing = []
          def walk(v):
              if isinstance(v, dict): [walk(x) for x in v.values()]
              elif isinstance(v, list): [walk(x) for x in v]
              elif isinstance(v, str) and v.rsplit('.', 1)[-1] in ('webp', 'png', 'jpg', 'mp3') and not os.path.exists('play/aeloria/art/' + v): missing.append(v)
          walk(man); print('manifest missing:', missing[:10]); sys.exit(1 if missing else 0)
          PY
          for f in play/aeloria/*.js; do node --check "$f" || exit 1; done
          grep -o 'url([^)]*)' play/aeloria/fonts/fonts.css | tr -d '()' | sed 's/^url//' | sort -u | while read f; do test -f "play/aeloria/fonts/$f" || { echo "missing font $f"; exit 1; }; done
          echo validated

  build:
    needs: validate
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/aeloria
        run: xcodegen generate

      - name: Build for the iOS Simulator
        working-directory: ios/aeloria
        run: |
          set -o pipefail
          xcodebuild -project Aeloria.xcodeproj -scheme Aeloria -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|warning: .*Aeloria/|BUILD (SUCCEEDED|FAILED)|\*\*" || true
          test -d build/Build/Products/Debug-iphonesimulator/Aeloria.app
          test -f build/Build/Products/Debug-iphonesimulator/Aeloria.app/Game/index.html

      - name: Launch in the simulator and check the game loads
        working-directory: ios/aeloria
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/Aeloria.app
          xcrun simctl launch --console-pty "$UDID" space.kinzhal.aeloria > launch.log 2>&1 &
          sleep 40
          xcrun simctl io "$UDID" screenshot simulator.png || true
          grep -E "AELORIA_SMOKE|UMP|AdMob|StoreKit|Google Mobile Ads" launch.log | head -40 || true
          grep -q 'AELORIA_SMOKE' launch.log
          grep 'AELORIA_SMOKE' launch.log | grep -q '"art":true'
          grep 'AELORIA_SMOKE' launch.log | grep -q '"ads":true'
          grep 'AELORIA_SMOKE' launch.log | grep -q '"pay":true'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aeloria-ios-smoke
          path: |
            ios/aeloria/simulator.png
            ios/aeloria/launch.log
          if-no-files-found: ignore
