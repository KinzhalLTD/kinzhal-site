# kinzhal.space — static site for every Kinzhal game. Netlify runs the build on every push.
[build]
  command = "node build.mjs"
  publish = "public"

[build.environment]
  NODE_VERSION = "20"

# Always serve the bare domain over HTTPS (www → kinzhal.space).
[[redirects]]
  from = "https://www.kinzhal.space/*"
  to = "https://kinzhal.space/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

# AdMob must always get a fresh, plain-text app-ads.txt.
[[headers]]
  for = "/app-ads.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=300"
